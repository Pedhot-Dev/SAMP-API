name: CMake Build (MSVC & MinGW)

on:
  push:
    branches: [ multiver ]
    tags:
      - 'v*'   # Contoh: v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, mingw]

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🧰 Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'

      # ============================================
      # ============ BUILD DENGAN MSVC =============
      # ============================================
      - name: 🧱 Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          cmake -B build-msvc -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: 🔨 Build (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          cmake --build build-msvc --config Release

      # ============================================
      # ============ BUILD DENGAN MINGW ============
      # ============================================
      - name: 🧰 Setup MinGW
        if: matrix.compiler == 'mingw'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x86_64

      - name: 🧱 Configure (MinGW)
        if: matrix.compiler == 'mingw'
        run: |
          cmake -B build-mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: 🔨 Build (MinGW)
        if: matrix.compiler == 'mingw'
        run: |
          cmake --build build-mingw --config Release

      # ============================================
      # ============ PACK DAN UPLOAD ARTIFAK =======
      # ============================================
      - name: 📦 Package build result
        run: |
          mkdir -p output
          if "${{ matrix.compiler }}" == "msvc" (
            7z a output/build-msvc.zip ./build-msvc/*
          ) else (
            7z a output/build-mingw.zip ./build-mingw/*
          )

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: output/

  # ================================================
  # ============ UPLOAD KE GITHUB RELEASE ==========
  # ================================================
  release:
    name: 📦 Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 🚀 Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/build-msvc.zip
            artifacts/**/build-mingw.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
