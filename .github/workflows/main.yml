name: CMake Build (MSVC)

on:
  push:
    branches: [ multiver ]
    tags:
      - 'v*'   # Contoh: v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🧰 Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'

      # ============================================
      # ============ BUILD DENGAN MSVC =============
      # ============================================
      - name: 🧱 Configure (MSVC)
        run: |
          cmake -B build-msvc -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: 🔨 Build (MSVC)
        run: |
          cmake --build build-msvc --config Release

      # ============================================
      # ============ PACK DAN UPLOAD ARTIFAK =======
      # ============================================
      - name: 📦 Package build result
        run: |
          mkdir -p output
          7z a output/build-msvc.zip ./build-msvc/*
      
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc
          path: output/

  # ================================================
  # ============ UPLOAD KE GITHUB RELEASE ==========
  # ================================================
  release:
    name: 📦 Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-msvc
          path: ./artifacts

      - name: 🚀 Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/build-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
